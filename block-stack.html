<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숲에서 하는 테트리스</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #385c45, #182e26 65%, #10221c);
      color: #f3f2df;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    #forest {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(100% - 24px, 554px);
      padding: 12px;
      background: #10271ee8;
      border-radius: 14px;
    }
    h1 { margin: 0 0 12px; font-size: 1.75rem; }
    .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 36%); gap: 12px; }
    .board { position: relative; }
    canvas { display: block; width: 100%; height: auto; background: #11271f; }
    #board, aside { border: 1px solid #668575; border-radius: 10px; }
    aside { align-self: start; padding: 10px; background: #253f33; }
    aside p { margin: 0 0 6px; }
    #score { display: block; font-size: 1.6rem; font-weight: bold; overflow-wrap: anywhere; }
    #next { max-width: 96px; border-radius: 6px; }
    .name-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1; min-width: 7em; padding: .45em;
      border: 1px solid #668575; border-radius: 6px;
      background: #11271f; color: inherit; font: inherit;
    }
    .rank-title { margin: 12px 0 4px; font-size: 1rem; }
    #ranking { margin: 0; padding-inline-start: 1.45em; overflow-wrap: anywhere; }
    #storage-status { margin-top: 8px; }
    #game-over {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      background: #11271fed;
      border-radius: 10px;
    }
    #game-over[hidden] { display: none; }
    #game-over h2, #game-over p { margin: 0 0 12px; }
    button {
      padding: .55em .9em;
      border: 0;
      border-radius: 6px;
      background: #d1e7ac;
      color: #172c21;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .controls { margin: 12px 0 0; color: #d6e5cf; }
    .items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .items button { font-size: .9rem; }
    .items button:disabled { opacity: .55; cursor: default; }
    #item-status { margin: 6px 0 0; min-height: 1.5em; color: #d6e5cf; }
  </style>
</head>
<body>
  <canvas id="forest" aria-hidden="true"></canvas>
  <main>
    <h1>숲에서 하는 테트리스</h1>
    <form class="name-form" id="name-form">
      <label for="player-name">플레이어 이름</label>
      <input id="player-name" maxlength="16" autocomplete="off" placeholder="숲지기">
      <button type="submit">이름 설정</button>
    </form>
    <div class="game">
      <div class="board">
        <canvas id="board" width="300" height="540" aria-label="블록 쌓기 게임판"></canvas>
        <section id="game-over" aria-labelledby="end-title" hidden>
          <h2 id="end-title">게임 종료</h2>
          <p>최종 점수 <strong id="final-score"></strong></p>
          <button id="restart">다시 시작</button>
        </section>
      </div>
      <aside>
        <p>현재 점수 <output id="score">0</output></p>
        <p>다음 블록</p>
        <canvas id="next" width="96" height="96" aria-label="다음 블록"></canvas>
        <h2 class="rank-title">점수 순위</h2>
        <p id="empty-rank">아직 기록이 없어요.</p>
        <ol id="ranking"></ol>
        <p id="storage-status" role="status" hidden>이 브라우저에서는 순위가 현재 창에만 저장돼요.</p>
      </aside>
    </div>
    <p class="controls"><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>↑</kbd> 회전 · <kbd>↓</kbd> 빠르게 내리기 · <kbd>스페이스바</kbd> 즉시 떨어뜨리기</p>
    <div class="items" aria-label="숲 아이템">
      <button id="wind" type="button">1 · 🌬️ 숲바람</button>
      <button id="worm" type="button">2 · 🐛 장난벌레</button>
      <button id="moss" type="button">3 · 🌿 이끼 씨앗</button>
    </div>
    <p id="item-status" role="status"></p>
  </main>
  <script>
    const COLS = 10, ROWS = 18, CELL = 30;
    const START_DELAY = 850, MIN_DELAY = 120;
    const POINTS = [0, 100, 300, 500, 800];

    // 0은 빈칸, 1은 블록의 한 칸입니다.
    const shapes = [
      { cells: [[1], [1], [1], [1]], color: "#32e6ff" },
      { cells: [[1, 1], [1, 1]], color: "#ffce48" },
      { cells: [[1, 0], [1, 1], [1, 0]], color: "#c190ff" },
      { cells: [[1, 1, 1]], color: "#ff8750" },
      { cells: [[1, 1], [0, 1]], color: "#75f596" },
      { cells: [[1, 1, 0], [0, 1, 1]], color: "#ff71b9" }
    ];

    const board = document.querySelector("#board").getContext("2d");
    const preview = document.querySelector("#next").getContext("2d");
    const scoreLabel = document.querySelector("#score");
    const gameOver = document.querySelector("#game-over");
    const finalScore = document.querySelector("#final-score");
    const restart = document.querySelector("#restart");
    const nameForm = document.querySelector("#name-form");
    const nameInput = document.querySelector("#player-name");
    const ranking = document.querySelector("#ranking");
    const emptyRank = document.querySelector("#empty-rank");
    const storageStatus = document.querySelector("#storage-status");
    const itemButtons = ["wind", "worm", "moss"].map(id => document.getElementById(id));
    const itemStatus = document.querySelector("#item-status");
    const STORAGE_KEY = "forest-block-stack";
    let playerName = "숲지기";
    let records = [];

    let grid, current, next, score, totalLines, ended, timer;
    let usedItems, wormFound;

    // 인터넷 연결 없이 이 브라우저에 이름과 상위 5개 점수를 저장합니다.
    function saveRecords() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ playerName, records }));
      } catch {
        storageStatus.hidden = false;
      }
    }

    function drawRanking() {
      ranking.replaceChildren();
      emptyRank.hidden = records.length > 0;
      for (const record of records) {
        const item = document.createElement("li");
        item.textContent = `${record.name} · ${record.score}점`;
        ranking.append(item);
      }
    }

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        playerName = saved.playerName;
        records = saved.records;
      }
    } catch {
      storageStatus.hidden = false;
    }
    nameInput.value = playerName;
    drawRanking();

    nameForm.addEventListener("submit", event => {
      event.preventDefault();
      playerName = nameInput.value.trim() || "숲지기";
      nameInput.value = playerName;
      saveRecords();
      nameInput.blur();
      event.submitter?.blur();
    });

    function emptyRow() {
      return Array(COLS).fill(0);
    }

    function randomShape() {
      return shapes[Math.floor(Math.random() * shapes.length)];
    }

    // 보드 밖이거나 이미 색이 채워진 칸에는 블록을 놓을 수 없습니다.
    function fits(cells, x, y) {
      return cells.every((row, dy) => row.every((cell, dx) =>
        !cell || (x + dx >= 0 && x + dx < COLS &&
          y + dy >= 0 && y + dy < ROWS && !grid[y + dy][x + dx])
      ));
    }

    // 착지 윤곽선과 스페이스바가 같은 위치를 사용합니다.
    function landingY() {
      let y = current.y;
      while (fits(current.cells, current.x, y + 1)) y++;
      return y;
    }

    function spawn() {
      current = {
        ...next,
        x: Math.floor((COLS - next.cells[0].length) / 2),
        y: 0
      };
      next = randomShape();
      if (!fits(current.cells, current.x, current.y)) {
        ended = true;
        clearTimeout(timer);
        finalScore.textContent = score;
        gameOver.hidden = false;
        records.push({ name: playerName, score });
        records.sort((a, b) => b.score - a.score);
        records = records.slice(0, 5);
        saveRecords();
        drawRanking();
        restart.focus();
      }
    }

    function move(dx) {
      const x = current.x + dx;
      if (fits(current.cells, x, current.y)) current.x = x;
    }

    function rotate() {
      // 기존 열을 아래부터 위로 읽으면 시계 방향으로 돌아갑니다.
      const cells = current.cells[0].map((_, col) =>
        current.cells.map((_, row) => current.cells[current.cells.length - 1 - row][col])
      );
      // 가장자리에서는 좌우로 한두 칸 옮겨 회전할 수 있는지 확인합니다.
      for (const offset of [0, -1, 1, -2, 2]) {
        const x = current.x + offset;
        if (fits(cells, x, current.y)) {
          current.cells = cells;
          current.x = x;
          break;
        }
      }
    }

    function drop() {
      if (fits(current.cells, current.x, current.y + 1)) {
        current.y++;
        return;
      }

      // 더 내려갈 수 없으면 현재 블록의 색을 보드에 기록합니다.
      current.cells.forEach((row, dy) => row.forEach((cell, dx) => {
        if (cell) grid[current.y + dy][current.x + dx] = current.color;
      }));

      clearLines();
      if (!wormFound && grid.flat().filter(Boolean).length >= 12 &&
          coveredCells(true).length > 0 && Math.random() < .35) {
        wormFound = true;
        itemStatus.textContent = "장난벌레가 나타났어요. 2번으로 사용할 수 있어요.";
      }
      spawn();
    }

    function clearLines() {
      // 빈칸이 남은 줄만 보관하고, 없앤 줄 수만큼 위에 빈 줄을 붙입니다.
      grid = grid.filter(row => row.includes(0));
      const cleared = ROWS - grid.length;
      for (let i = 0; i < cleared; i++) grid.unshift(emptyRow());
      score += POINTS[cleared];
      totalLines += cleared;
      scoreLabel.textContent = score;
      return cleared;
    }

    // 같은 열에서 위에 고정 블록이 있는 칸만 더미 안쪽으로 봅니다.
    function coveredCells(filled) {
      const cells = [];
      for (let x = 0; x < COLS; x++) {
        let covered = false;
        for (let y = 0; y < ROWS; y++) {
          const occupied = Boolean(grid[y][x]);
          if (covered && occupied === filled) cells.push([x, y]);
          if (occupied) covered = true;
        }
      }
      return cells;
    }

    function useItem(index) {
      if (ended || usedItems[index] || (index === 1 && !wormFound)) return;

      if (index === 0) {
        if (!grid.some(row => row.some(Boolean))) {
          itemStatus.textContent = "쓸어낼 블록이 생기면 숲바람을 쓸 수 있어요.";
          return;
        }
        grid = Array.from({ length: ROWS }, emptyRow);
        itemStatus.textContent = "숲바람이 쌓인 블록을 모두 쓸어냈어요.";
      }

      if (index === 1) {
        const cells = coveredCells(true);
        const count = Math.min(8, cells.length);
        if (!count) {
          itemStatus.textContent = "장난벌레가 파먹을 블록이 아직 없어요.";
          return;
        }
        for (let i = 0; i < count; i++) {
          const index = Math.floor(Math.random() * cells.length);
          const [[x, y]] = cells.splice(index, 1);
          grid[y][x] = 0;
        }
        itemStatus.textContent = `장난벌레가 더미에 구멍을 ${count}개 뚫었어요.`;
      }

      if (index === 2) {
        // 떨어지는 블록 아래에서만 메우면 줄을 지운 뒤 함께 내려도 충돌하지 않습니다.
        const bottom = current.y + current.cells.length - 1;
        const holes = coveredCells(false).filter(([, y]) => y > bottom);
        holes.sort((a, b) => b[1] - a[1]);
        const chosen = holes.slice(0, 3);
        if (!chosen.length) {
          itemStatus.textContent = "떨어지는 블록 아래에 메울 구멍이 아직 없어요.";
          return;
        }
        for (const [x, y] of chosen) grid[y][x] = "#a9dc71";
        const cleared = clearLines();
        current.y += cleared;
        if (cleared) {
          clearTimeout(timer);
          scheduleDrop();
        }
        itemStatus.textContent = `이끼가 구멍을 ${chosen.length}칸 메웠어요.`;
      }

      usedItems[index] = true;
      draw();
    }

    function paint(ctx, cells, x, y, size, color) {
      cells.forEach((row, dy) => row.forEach((cell, dx) => {
        if (!cell) return;
        const left = x + dx * size + 1;
        const top = y + dy * size + 1;
        const side = size - 2;
        // 밝은 면, 어두운 면, 작은 반사광으로 보석처럼 보이게 합니다.
        const shine = ctx.createLinearGradient(left, top, left + side, top + side);
        shine.addColorStop(0, "#f7ffef");
        shine.addColorStop(.36, color || cell);
        shine.addColorStop(.72, color || cell);
        shine.addColorStop(1, "#17283d");
        ctx.fillStyle = shine;
        ctx.fillRect(left, top, side, side);
        ctx.strokeStyle = "#ffffff88";
        ctx.strokeRect(left + .5, top + .5, side - 1, side - 1);
        ctx.fillStyle = "#fffffff2";
        ctx.fillRect(left + 3, top + 6, 7, 1);
        ctx.fillRect(left + 6, top + 3, 1, 7);
      }));
    }

    function draw() {
      board.clearRect(0, 0, board.canvas.width, board.canvas.height);
      board.fillStyle = "#203b2e";
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          board.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }
      }
      paint(board, grid, 0, 0, CELL);
      if (!ended) {
        const y = landingY();
        board.strokeStyle = current.color;
        board.globalAlpha = .65;
        current.cells.forEach((row, dy) => row.forEach((cell, dx) => {
          if (cell) board.strokeRect((current.x + dx) * CELL + 3, (y + dy) * CELL + 3, CELL - 6, CELL - 6);
        }));
        board.globalAlpha = 1;
        paint(board, current.cells, current.x * CELL, current.y * CELL, CELL, current.color);
      }

      preview.clearRect(0, 0, 96, 96);
      const size = 20;
      const x = (96 - next.cells[0].length * size) / 2;
      const y = (96 - next.cells.length * size) / 2;
      paint(preview, next.cells, x, y, size, next.color);
      itemButtons.forEach((button, index) => {
        button.disabled = ended || usedItems[index] || (index === 1 && !wormFound);
      });
    }

    function scheduleDrop() {
      // 줄을 지울 때마다 다음 낙하까지의 시간이 25ms씩 짧아집니다.
      const delay = Math.max(MIN_DELAY, START_DELAY - totalLines * 25);
      timer = setTimeout(() => {
        drop();
        draw();
        if (!ended) scheduleDrop();
      }, delay);
    }

    function start() {
      clearTimeout(timer);
      grid = Array.from({ length: ROWS }, emptyRow);
      score = 0;
      totalLines = 0;
      ended = false;
      usedItems = [false, false, false];
      wormFound = false;
      itemStatus.textContent = "아이템은 한 판에 한 번씩 쓸 수 있어요. 장난벌레는 블록이 쌓이면 가끔 나타나요.";
      scoreLabel.textContent = score;
      gameOver.hidden = true;
      next = randomShape();
      spawn();
      draw();
      scheduleDrop();
    }

    document.addEventListener("keydown", event => {
      const keys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "1", "2", "3"];
      if (ended || nameForm.contains(event.target) || !keys.includes(event.key)) return;
      if (event.key === " " && itemButtons.includes(event.target)) return;
      event.preventDefault();
      const item = ["1", "2", "3"].indexOf(event.key);
      if (item !== -1) {
        if (!event.repeat) useItem(item);
        return;
      }
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
      if (event.key === "ArrowUp" && !event.repeat) rotate();
      if (event.key === " " && event.repeat) return;
      if (event.key === "ArrowDown" || event.key === " ") {
        // 스페이스바는 내려갈 수 있는 마지막 칸까지 이동한 뒤 블록을 고정합니다.
        clearTimeout(timer);
        if (event.key === " ") current.y = landingY();
        drop();
        if (!ended) scheduleDrop();
      }
      draw();
    });

    itemButtons.forEach((button, index) => button.addEventListener("click", () => {
      button.blur();
      useItem(index);
    }));
    restart.addEventListener("click", start);
    start();
  </script>
  <script>
    // 숲은 별도의 캔버스에 그리고, 블록 낙하 시간은 기존 타이머로 관리합니다.
    const forest = document.querySelector("#forest");
    const scenery = forest.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const layers = [
      { count: 23, height: .40, ground: .73, color: "#587b61" },
      { count: 16, height: .59, ground: .88, color: "#305945" },
      { count: 12, height: .79, ground: 1.05, color: "#173c2e" }
    ];
    let forestFrame;

    function drawForest(time) {
      const w = forest.width;
      const h = forest.height;
      const sky = scenery.createRadialGradient(w * .68, h * .18, 0, w * .68, h * .18, Math.max(w, h));
      sky.addColorStop(0, "#dddfa6");
      sky.addColorStop(.27, "#82a68a");
      sky.addColorStop(1, "#142e27");
      scenery.fillStyle = sky;
      scenery.fillRect(0, 0, w, h);

      // 먼 나무부터 그리고, 가까운 나무의 꼭대기를 바람에 조금씩 움직입니다.
      for (const layer of layers) {
        scenery.fillStyle = layer.color;
        const ground = layer.ground * h;
        scenery.fillRect(0, ground, w, Math.max(0, h - ground));
        for (let i = 0; i < layer.count; i++) {
          const x = w * i / (layer.count - 1);
          const height = h * layer.height * (.8 + .2 * Math.sin(i * 2.7));
          const width = Math.min(w / layer.count * 1.05, height * .31);
          const sway = Math.sin(time / 1350 + i * .7) * width * .13;
          scenery.fillRect(x - width * .09, ground - height * .4, width * .18, height * .4);
          for (let tier = 0; tier < 3; tier++) {
            const top = ground - height + tier * height * .21;
            const span = width * (.54 + tier * .2);
            scenery.beginPath();
            scenery.moveTo(x + sway, top);
            scenery.lineTo(x + span, top + height * .47);
            scenery.lineTo(x - span, top + height * .47);
            scenery.closePath();
            scenery.fill();
          }
        }
      }

      // 반딧불마다 이동 속도와 반짝이는 시점을 조금씩 다르게 합니다.
      for (let i = 0; i < 32; i++) {
        const x = w * ((i * 17 % 37) / 37) + Math.sin(time / 2400 + i) * 28;
        const y = h * (.28 + (i * 11 % 31) / 46) + Math.cos(time / 1900 + i) * 22;
        const glow = scenery.createRadialGradient(x, y, 0, x, y, 8);
        glow.addColorStop(0, "#fffbd5");
        glow.addColorStop(.26, "#e7fa9eb0");
        glow.addColorStop(1, "#e7fa9e00");
        scenery.globalAlpha = .25 + .75 * (1 + Math.sin(time / 640 + i)) / 2;
        scenery.fillStyle = glow;
        scenery.fillRect(x - 8, y - 8, 16, 16);
      }
      scenery.globalAlpha = 1;
    }

    function animateForest(time) {
      drawForest(time);
      forestFrame = requestAnimationFrame(animateForest);
    }

    function resizeForest() {
      forest.width = innerWidth;
      forest.height = innerHeight;
      cancelAnimationFrame(forestFrame);
      if (reducedMotion.matches) drawForest(0);
      else forestFrame = requestAnimationFrame(animateForest);
    }

    window.addEventListener("resize", resizeForest);
    reducedMotion.addEventListener("change", resizeForest);
    resizeForest();
  </script>
</body>
</html>
